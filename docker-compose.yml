services:
  db:
    image: postgres:16-alpine
    container_name: pozivnica-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pozivnica
      POSTGRES_PASSWORD: pozivnica
      POSTGRES_DB: pozivnica
    ports:
      - '5432:5432'
    volumes:
      - pozivnica-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pozivnica -d pozivnica']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for the media/photo adapter.
  # Only needed when STORAGE_DRIVER=s3; the default local driver writes to disk.
  storage:
    image: minio/minio:latest
    container_name: pozivnica-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pozivnica
      MINIO_ROOT_PASSWORD: pozivnica123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - pozivnica-storage-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pozivnica-db-data:
  pozivnica-storage-data:
